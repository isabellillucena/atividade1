<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Frontend</title>
</head>

<style>
    div {
    border: 1px solid black;
    width: 300px;
    height: 200px;
    padding: 10px;
    margin-bottom: 10px;
}

.filmes { 
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
</style>

<body>
    <h1>Lista de Filmes</h1>

    <section class="filmes"></section>

    <script src="script.js"></script>
</body>

<script>
    async function buscarFilmes() {
    // ir ao backend, acessar a rota GET e mostrar os filmes na tela.
    const resposta = await fetch("http://localhost:3000")
    const filmes = await resposta.json()
    const sectionFilmes = document.querySelector(".filmes")

    filmes.forEach((filme) => {
        sectionFilmes.innerHTML += `
            <div>
                <h2>${filme.titulo}</h2>
                <p><strong>Gênero:</strong> ${filme.genero}</p>
                <p><strong>Duração:</strong> ${filme.duracao} minutos</p>
                <p><strong>Classificação indicativa:</strong> ${filme.classificacao > 0 ? filme.classificacao + ' anos' : 'Livre'}</p>
            </div>
        `
    })
}

buscarFilmes()
</script>

</html>
